name: Publicar

# Em todo push e pull request: compila para conferir que nada quebrou.
# Em uma tag de versão (ex.: v0.1.0): gera o Hefesto.exe e publica a release com SHA256SUMS.txt.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publicar (arquivo único, com o .NET embutido)
        run: dotnet publish Hefesto.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o dist -nologo

      - name: Montar pacote e SHA-256
        shell: pwsh
        run: |
          Copy-Item LEIA-ME.txt dist/LEIA-ME.txt
          Compress-Archive -Path dist/Hefesto.exe, dist/LEIA-ME.txt -DestinationPath Hefesto.zip
          $linhas = foreach ($f in @('dist/Hefesto.exe', 'Hefesto.zip')) {
            "{0}  {1}" -f (Get-FileHash $f -Algorithm SHA256).Hash.ToLower(), (Split-Path $f -Leaf)
          }
          $linhas | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Guardar o build (artefato do Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Hefesto-${{ github.sha }}
          path: |
            dist/Hefesto.exe
            Hefesto.zip
            SHA256SUMS.txt
          retention-days: 14

      - name: Release da versão (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $env:GITHUB_REF_NAME Hefesto.zip dist/Hefesto.exe SHA256SUMS.txt --title "Hefesto $env:GITHUB_REF_NAME" --notes-file NOVIDADES.md
